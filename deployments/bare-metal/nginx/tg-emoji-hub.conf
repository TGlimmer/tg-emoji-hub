# tg-emoji-hub Nginx 站点配置
# 使用前：把 __DOMAIN__ 替换成你的域名
#   sudo sed -i 's/__DOMAIN__/your-domain.com/g' /etc/nginx/conf.d/tg-emoji-hub.conf

# HTTP → HTTPS 强制跳转
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Let's Encrypt ACME challenge 例外
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __DOMAIN__;

    # SSL 证书（Let's Encrypt 路径）
    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;

    # 现代 SSL 配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    # ---------- gzip ----------
    gzip on;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/xml
        text/javascript;
    # .tgs 是 gzip 压缩过的 lottie，不要二次压缩；.webp 已压缩
    gzip_disable "MSIE [1-6]\.";

    # ---------- 静态文件：缩略图 ----------
    # Nginx 直接服务，绕开 Go server，高效
    location /thumbs/ {
        alias /opt/tg-emoji-hub/media/thumbs/;

        # 文件名是 sticker ID，内容永远不变，大胆缓存一年
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;

        # 只允许 .webp / .png / .gif，不让访问其他文件
        location ~* \.(webp|png|gif)$ {
            alias /opt/tg-emoji-hub/media/thumbs/;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }

    # ---------- 静态文件：原始 emoji 动态贴纸 ----------
    location /emoji/ {
        alias /opt/tg-emoji-hub/media/emoji/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;

        # tgs 文件浏览器不认，显式设置 Content-Type
        location ~* \.tgs$ {
            alias /opt/tg-emoji-hub/media/emoji/;
            add_header Content-Type "application/x-tgsticker";
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location ~* \.webm$ {
            alias /opt/tg-emoji-hub/media/emoji/;
            add_header Content-Type "video/webm";
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }

    # ---------- MCP Streamable HTTP（长连接） ----------
    # 关掉 buffering，不然 SSE 事件流会被 Nginx 攒着一起发
    location /mcp {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";      # 清掉 close，保持长连接
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;            # MCP 会话可能很长，60s 默认超时会断
        proxy_send_timeout 3600s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- API 反向代理 ----------
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ---------- 健康检查 ----------
    location /healthz {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 5s;
        # 健康检查不需要记日志，减少噪音
        access_log off;
    }

    # ---------- 前端 SPA ----------
    # 放最后，优先级最低，其他 location 没匹配到才来这里
    location / {
        root /opt/tg-emoji-hub/web/dist;
        try_files $uri $uri/ /index.html;

        # HTML 不缓存（每次部署都要更新入口文件）
        location ~* \.html$ {
            add_header Cache-Control "no-cache, must-revalidate";
        }

        # JS/CSS/字体/图片 缓存一年（Vite 构建产物文件名含 hash）
        location ~* \.(js|css|woff2?|ttf|eot|ico|svg|png)$ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }
}
