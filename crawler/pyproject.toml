[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "W",   # pycodestyle warnings
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # 行长由 formatter 处理
    "B008",  # 函数参数默认值用函数调用（dataclass 场景多见）
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # assert False 在测试里允许
